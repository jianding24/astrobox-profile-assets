name: Publish pet board
on:
  push:
    branches: [main]
    paths: [board-v12-public.zip, astrobox-background.png, astrobox-background-v2.png, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Prepare only public assets
        run: |
          mkdir -p _site
          unzip -q board-v12-public.zip -d _site
          cp astrobox-background.png astrobox-background-v2.png _site/
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
